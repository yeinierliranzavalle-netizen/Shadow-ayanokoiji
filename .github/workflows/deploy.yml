# ==================================================
# SHADOW ARISE - DEPLOY A CLOUDFLARE WORKERS
# ==================================================
# Este workflow se ejecuta al hacer push a la rama main
# y también se puede ejecutar manualmente desde Actions.

name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: # Permite ejecución manual desde el panel de GitHub

env:
  # Versión de Node a usar (evita problemas de compatibilidad)
  NODE_VERSION: '22'
  # Versión de Wrangler (fija para evitar cambios inesperados)
  WRANGLER_VERSION: '3.90.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Evita que el job se cuelgue indefinidamente

    steps:
      # ==========================================
      # 1. CHECKOUT DEL CÓDIGO
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. CONFIGURAR NODE.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ==========================================
      # 3. INSTALAR DEPENDENCIAS
      # ==========================================
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        # npm ci es más rápido y fiable que npm install en CI

      # ==========================================
      # 4. VERIFICAR QUE EL CÓDIGO ES VÁLIDO
      # ==========================================
      - name: Validate Worker code
        run: |
          if [ ! -f "_worker.js" ] && [ ! -f "src/index.ts" ]; then
            echo "❌ No se encontró _worker.js ni src/index.ts"
            exit 1
          fi
          echo "✅ Worker code found"

      # ==========================================
      # 5. VERIFICAR VARIABLES DE ENTORNO
      # ==========================================
      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.CF_API_TOKEN }}" ]; then
            echo "❌ CF_API_TOKEN no está configurado"
            exit 1
          fi
          if [ -z "${{ secrets.CF_ID }}" ]; then
            echo "❌ CF_ID (Account ID) no está configurado"
            exit 1
          fi
          echo "✅ Secrets verificados"

      # ==========================================
      # 6. CONSTRUIR PROYECTO (si existe script de build)
      # ==========================================
      - name: Build project
        run: |
          if npm run | grep -q " build"; then
            npm run build
          else
            echo "ℹ️ No se encontró script de build, saltando..."
          fi

      # ==========================================
      # 7. DEPLOY A CLOUDFLARE WORKERS (v4)
      # ==========================================
      # Usamos v4 porque es más estable y maneja mejor las dependencias
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy --minify
          # --minify reduce el tamaño del código desplegado

      # ==========================================
      # 8. NOTIFICACIÓN DE ÉXITO (opcional)
      # ==========================================
      - name: Deployment successful
        run: echo "✅ Despliegue completado correctamente"

      # ==========================================
      # 9. NOTIFICACIÓN DE FALLO (con logs)
      # ==========================================
      - name: Debug logs on failure
        if: failure()
        run: |
          echo "❌ El despliegue falló. Revisa los logs arriba."
          echo "Verifica que las variables CF_API_TOKEN y CF_ID estén configuradas."
          echo "También revisa que el código del Worker sea válido."
          
