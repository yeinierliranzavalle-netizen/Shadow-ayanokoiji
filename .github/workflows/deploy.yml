# ==================================================
# SHADOW ARISE - DEPLOY A CLOUDFLARE WORKERS
# ==================================================

name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js (sin cache, porque no tenemos package-lock.json)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Instalar Wrangler globalmente (no usa package-lock.json)
      - name: Install Wrangler
        run: npm install -g wrangler

      # 4. Verificar que el Worker existe
      - name: Check Worker file
        run: |
          if [ ! -f "_worker.js" ]; then
            echo "❌ No se encontró _worker.js en la raíz del proyecto."
            exit 1
          fi
          echo "✅ _worker.js encontrado"

      # 5. Desplegar a Cloudflare Workers
      - name: Deploy to Cloudflare Workers
        run: wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ID }}

      # 6. Mensaje de éxito
      - name: Success
        run: echo "✅ Despliegue completado"
