# ==================================================
# SHADOW ARISE - DEPLOY A CLOUDFLARE WORKERS
# ==================================================

name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Instalar Wrangler globalmente
      - name: Install Wrangler
        run: npm install -g wrangler

      # 4. Verificar que el Worker existe (con el nombre correcto)
      - name: Check Worker file
        run: |
          if [ ! -f "worker.js" ]; then
            echo "❌ No se encontró worker.js en la raíz del proyecto."
            exit 1
          fi
          if [ ! -f "wrangler.toml" ]; then
            echo "❌ No se encontró wrangler.toml"
            exit 1
          fi
          echo "✅ worker.js y wrangler.toml encontrados"

      # 5. Desplegar usando wrangler.toml
      - name: Deploy to Cloudflare Workers
        run: wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ID }}

      # 6. Mensaje de éxito
      - name: Success
        run: echo "✅ Despliegue completado"
