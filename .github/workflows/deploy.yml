# ==================================================
# SHADOW ARISE - DEPLOY A CLOUDFLARE WORKERS
# ==================================================

name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Verify files
        run: |
          if [ ! -f "worker.js" ]; then
            echo "❌ No se encontró worker.js"
            exit 1
          fi
          if [ ! -f "wrangler.toml" ]; then
            echo "❌ No se encontró wrangler.toml"
            exit 1
          fi
          echo "✅ Archivos encontrados"

      - name: Deploy to Cloudflare Workers
        run: wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ID }}

      - name: Success
        run: echo "✅ Despliegue completado"
